name: Production drift

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare production with main
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module -e '
            const response = await fetch("https://scrobble.dev/release.json", { headers: { "cache-control": "no-cache" } });
            if (!response.ok) throw new Error(`Production fingerprint returned ${response.status}`);
            const release = await response.json();
            if (release.commit !== process.env.EXPECTED_COMMIT) {
              console.warn(`::warning::Production is ${release.commit}; main is ${process.env.EXPECTED_COMMIT}.`);
              console.log(`Drift detected: Production (${release.commit}) != main (${process.env.EXPECTED_COMMIT}).`);
            } else {
              console.log(`Production matches ${release.commit}.`);
            }
          '
